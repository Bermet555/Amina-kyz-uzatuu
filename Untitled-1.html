<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Кадыркулов Дуйшен — Горы Кыргызстана</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #121c22;
      padding: 24px;
    }
    .canvas-wrapper {
      width: 100%;
      max-width: 1280px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      border-radius: 4px;
      overflow: hidden;
      background: #e8dec8;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .title-main {
      font-family: 'Montserrat', 'Arial Black', 'Segoe UI', sans-serif;
      font-weight: 900;
      font-size: 152px;
      letter-spacing: 4px;
    }
    .title-sub {
      font-family: 'Montserrat', 'Arial Black', 'Segoe UI', sans-serif;
      font-weight: 900;
      font-size: 136px;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="canvas-wrapper">
    <!-- Модульная сетка 8x4 (ячейка 200x200), итоговый размер 1600x800 -->
    <svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Текстура бумаги -->
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise" />
          <feColorMatrix type="matrix" values="
            0 0 0 0 0.15
            0 0 0 0 0.20
            0 0 0 0 0.22
            0 0 0 0.14 0" in="noise" result="coloredNoise" />
          <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply" />
        </filter>

        <!-- Мягкая тень для текста -->
        <filter id="text-shadow" x="-10%" y="-10%" width="125%" height="125%">
          <feDropShadow dx="4" dy="6" stdDeviation="5" flood-color="#0b1f2b" flood-opacity="0.45" />
        </filter>

        <!-- Диагональная штриховка (зелёно-охристая) -->
        <pattern id="stripes-pine" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="18" height="18" fill="#2c5938" />
          <line x1="0" y1="0" x2="0" y2="18" stroke="#c9933b" stroke-width="5" />
        </pattern>

        <!-- Геометрический узор для хвойного сектора -->
        <pattern id="kyrgyz-geo" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="24" height="24" fill="#1e4d2b" />
          <path d="M 4,4 L 20,4 L 20,20 L 8,20 L 8,10 L 14,10" fill="none" stroke="#3c7a4b" stroke-width="2" />
        </pattern>

        <!-- Маска для бирюзового озера-лепестка в центре -->
        <clipPath id="clip-lake-center">
          <path d="M 600,400 A 200,200 0 0,1 800,200 A 200,200 0 0,1 600,400 Z" />
        </clipPath>
      </defs>

      <!-- Основная группа с текстурой -->
      <g filter="url(#paper-grain)">
        <!-- Базовый фон -->
        <rect width="1600" height="800" fill="#e8dec8" />

        <!-- ================= ВЕРХНЯЯ ПОЛОВИНА (РЯДЫ 1–2) ================= -->

        <!-- Блок (0,0)-(400,400): вершины Тянь-Шаня, орнамент и бирюзовая чаша -->
        <polygon points="0,0 200,200 0,300" fill="#6d7e85" />
        <polygon points="200,0 400,0 400,250 200,250" fill="#d99e32" />
        <path d="M 200,0 A 140,140 0 0,1 400,0 L 200,180 Z" fill="#a8522d" />

        <!-- Левый горный пик -->
        <polygon points="20,300 200,0 380,300" fill="#0d4a6b" />
        <polygon points="200,0 380,300 200,300" fill="#08344d" />
        <polygon points="200,0 135,108 165,92 185,120 212,86 242,115 265,108" fill="#f4f6f7" />

        <!-- Второй горный пик правее -->
        <polygon points="100,300 280,100 400,260 400,300" fill="#546d7a" />
        <polygon points="280,100 218,169 245,155 268,185 296,158 332,175" fill="#f4f6f7" />

        <!-- Геометрический орнамент на склоне -->
        <polygon points="95,300 205,190 315,300" fill="#46575e" />
        <path d="M 135,300 L 175,260 L 195,280 L 180,295 M 165,240 L 205,205 L 245,240 L 220,265 L 205,250 L 190,265 M 275,300 L 235,260 L 215,280 L 230,295"
              fill="none" stroke="#c46d3b" stroke-width="10" stroke-linecap="square" />

        <!-- Нижний край блока (0,300)-(400,400) -->
        <polygon points="0,240 100,300 0,400" fill="#9c3c1c" />
        <polygon points="0,400 100,300 200,400" fill="#d99e32" />
        <polygon points="300,300 400,200 400,400" fill="#0b5c7a" />
        <polygon points="300,300 400,400 260,400" fill="#08344d" />
        <path d="M 100,300 A 100,100 0 0,0 300,300 Z" fill="#00a6b4" />

        <!-- Блок (400,0)-(800,400): солнце с лучами и центральные горы -->
        <rect x="400" y="0" width="400" height="400" fill="#e8dec8" />
        <g stroke="#c98836" stroke-width="8" opacity="0.7">
          <line x1="650" y1="200" x2="400" y2="0" />
          <line x1="650" y1="200" x2="550" y2="0" />
          <line x1="650" y1="200" x2="740" y2="0" />
          <line x1="650" y1="200" x2="880" y2="0" />
          <line x1="650" y1="200" x2="900" y2="120" />
          <line x1="650" y1="200" x2="400" y2="160" />
        </g>
        <circle cx="655" cy="200" r="135" fill="#d99e32" />
        <circle cx="665" cy="200" r="105" fill="#c46233" />
        <path d="M 665,200 L 740,125 A 105,105 0 0,1 665,305 Z" fill="#9c4824" />

        <path d="M 400,200 A 100,100 0 0,1 500,300 L 400,300 Z" fill="#00b4bd" />
        <rect x="400" y="300" width="100" height="100" fill="url(#stripes-pine)" />

        <polygon points="500,330 620,200 720,330" fill="#0d4a6b" />
        <polygon points="620,200 570,255 595,245 612,268 632,242 658,260" fill="#f4f6f7" />

        <polygon points="660,330 740,215 820,330" fill="#466273" />
        <polygon points="740,215 702,268 725,258 745,275 778,268" fill="#f4f6f7" />

        <path d="M 500,300 A 100,100 0 0,0 600,400 L 600,300 Z" fill="#08344d" />
        <g clip-path="url(#clip-lake-center)">
          <rect x="600" y="200" width="200" height="200" fill="#008c99" />
          <polygon points="600,400 800,200 800,400" fill="#00b4bd" opacity="0.7" />
        </g>

        <!-- Блок (800,0)-(1200,400): терракотовая дуга, горный пик и бирюзовое небо -->
        <rect x="800" y="0" width="200" height="400" fill="#d8c39e" />
        <polygon points="800,0 1000,0 800,200" fill="#e8dec8" />
        <path d="M 800,400 A 200,200 0 0,1 1000,200 L 1000,400 Z" fill="#a8522d" />
        <polygon points="800,400 890,245 980,400" fill="#3a6073" />
        <polygon points="890,245 848,318 872,305 892,326 912,302 932,318" fill="#f4f6f7" />

        <rect x="1000" y="0" width="200" height="200" fill="#00a6b4" />
        <polygon points="1000,200 1200,0 1200,200" fill="#0d4a6b" />
        <polygon points="1000,200 1160,35 1200,80 1200,400 1000,400" fill="#637885" />
        <polygon points="1160,35 1068,130 1105,115 1135,148 1170,115 1200,145 1200,80" fill="#f4f6f7" />
        <polygon points="1000,400 1200,200 1200,400" fill="#08344d" />
        <path d="M 1000,200 A 100,100 0 0,1 1000,400 Z" fill="#008c99" opacity="0.85" />

        <!-- Блок (1200,0)-(1600,400): бирюза с веткой ели, линии рельефа и терракота -->
        <rect x="1200" y="0" width="400" height="200" fill="#0095a8" />
        <g stroke="#1c4d2e" stroke-width="5" stroke-linecap="round">
          <line x1="1400" y1="180" x2="1595" y2="5" />
          <line x1="1430" y1="153" x2="1405" y2="115" />
          <line x1="1465" y1="122" x2="1440" y2="80" />
          <line x1="1500" y1="90" x2="1475" y2="48" />
          <line x1="1535" y1="58" x2="1510" y2="20" />
          <line x1="1450" y1="135" x2="1495" y2="148" />
          <line x1="1485" y1="103" x2="1535" y2="118" />
          <line x1="1520" y1="72" x2="1570" y2="85" />
        </g>

        <rect x="1200" y="200" width="200" height="200" fill="#c7d3d9" />
        <g fill="none" stroke="#2c3e47" stroke-width="3" opacity="0.65">
          <path d="M 1200,250 Q 1260,240 1290,200" />
          <path d="M 1200,300 Q 1280,280 1340,200" />
          <path d="M 1200,350 Q 1300,310 1380,200" />
        </g>
        <polygon points="1200,400 1400,200 1400,400" fill="#c46233" />
        <rect x="1400" y="200" width="200" height="200" fill="#d9ae6c" />
        <polygon points="1400,200 1600,200 1400,400" fill="#2c5938" />

        <!-- ================= НИЖНЯЯ ПОЛОВИНА (РЯДЫ 3–4) ================= -->

        <!-- Блок (0,400)-(400,800) -->
        <rect x="0" y="400" width="400" height="400" fill="#e8dec8" />
        <path d="M 200,400 A 200,200 0 0,0 200,800 Z" fill="#526a78" />
        <rect x="200" y="400" width="200" height="200" fill="#d99e32" />
        <g fill="#1c4d2e">
          <polygon points="200,505 225,405 250,505" />
          <polygon points="260,505 285,405 310,505" />
          <polygon points="340,505 365,405 390,505" />
          <polygon points="200,600 225,505 250,600" />
          <polygon points="270,570 285,510 300,570" />
          <polygon points="300,600 325,505 350,600" />
          <polygon points="350,600 375,505 400,600" />
        </g>
        <path d="M 200,600 L 400,600 A 200,200 0 0,1 200,800 Z" fill="#0d4a6b" />
        <g stroke="#00b4bd" stroke-width="5" stroke-linecap="round">
          <line x1="215" y1="635" x2="320" y2="635" />
          <line x1="260" y1="665" x2="365" y2="665" />
          <line x1="210" y1="695" x2="310" y2="695" />
          <line x1="245" y1="730" x2="335" y2="730" />
          <line x1="215" y1="760" x2="280" y2="760" />
        </g>

        <!-- Блок (400,400)-(800,800) -->
        <rect x="400" y="400" width="200" height="200" fill="#c47a35" />
        <path d="M 400,600 A 180,180 0 0,1 600,600 Z" fill="#123b22" />
        <g fill="none" stroke="#2f6e44" stroke-width="8">
          <polyline points="465,465 500,495 535,465" />
          <polyline points="465,495 500,525 535,495" />
          <polyline points="465,525 500,555 535,525" />
          <polyline points="465,555 500,585 535,555" />
        </g>

        <rect x="600" y="400" width="200" height="200" fill="#c7d3d9" />
        <polygon points="600,600 800,400 800,600" fill="#3a6073" />
        <path d="M 700,600 A 100,100 0 0,1 800,500 L 800,600 Z" fill="#c98836" />

        <rect x="400" y="600" width="400" height="200" fill="#1c4d2e" />
        <path d="M 400,600 L 600,600 L 400,800 Z" fill="#8c4a27" />
        <path d="M 550,600 A 100,100 0 0,0 700,600 Z" fill="#007c91" />
        <polygon points="400,800 600,680 600,800" fill="#12331e" />

        <!-- Блок (800,400)-(1200,800) -->
        <rect x="800" y="400" width="200" height="200" fill="#e8ecee" />
        <g fill="#123b22">
          <polygon points="825,405 802,445 848,445" />
          <polygon points="825,435 800,480 850,480" />
          <polygon points="825,470 798,515 852,515" />
          <polygon points="825,505 798,555 852,555" />

          <polygon points="895,405 872,445 918,445" />
          <polygon points="895,435 870,480 920,480" />
          <polygon points="895,470 868,515 922,515" />

          <polygon points="965,405 942,445 988,445" />
          <polygon points="965,435 940,480 990,480" />
        </g>
        <polygon points="800,600 1000,430 1000,600" fill="#7c8f99" />

        <rect x="1000" y="400" width="200" height="200" fill="#c98836" />
        <path d="M 1000,400 A 100,100 0 0,1 1100,500 L 1000,500 Z" fill="#e6b042" />
        <polygon points="1000,600 1200,400 1200,600" fill="#3a6073" />
        <path d="M 1000,600 A 200,200 0 0,1 1200,400 L 1200,600 Z" fill="#00a6b4" opacity="0.85" />

        <rect x="800" y="600" width="200" height="200" fill="#d9a85b" />
        <path d="M 800,800 A 200,200 0 0,1 1000,600 L 1000,800 Z" fill="#2c6b8c" />
        <g fill="none" stroke="#d9e8f0" stroke-width="3" opacity="0.8">
          <path d="M 840,790 C 880,760 940,780 990,760" />
          <path d="M 855,750 C 900,720 940,750 995,720" />
          <path d="M 885,710 C 925,685 955,710 995,680" />
          <path d="M 920,670 C 950,650 970,665 995,645" />
        </g>

        <rect x="1000" y="600" width="200" height="200" fill="#c46233" />
        <path d="M 1000,600 A 200,200 0 0,1 1200,800 L 1000,800 Z" fill="#0b6b82" />
        <polygon points="1100,800 1200,700 1200,800" fill="#c46233" />

        <!-- Блок (1200,400)-(1600,800) -->
        <rect x="1200" y="400" width="200" height="200" fill="#d99e32" />
        <path d="M 1200,400 A 200,200 0 0,1 1400,600 L 1200,600 Z" fill="url(#kyrgyz-geo)" />

        <rect x="1400" y="400" width="200" height="200" fill="#5e6b5e" />
        <path d="M 1400,400 A 200,200 0 0,1 1600,600 L 1400,600 Z" fill="#6b563c" opacity="0.8" />

        <rect x="1200" y="600" width="200" height="200" fill="#e8dec8" />
        <path d="M 1200,600 L 1400,600 A 200,200 0 0,1 1300,773 A 200,200 0 0,1 1200,600 Z" fill="#b8602c" />
        <path d="M 1300,600 L 1300,773 M 1300,640 L 1245,610 M 1300,640 L 1355,610
                 M 1300,685 L 1240,655 M 1300,685 L 1360,655
                 M 1300,730 L 1255,705 M 1300,730 L 1345,705"
              stroke="#4d2511" stroke-width="5" stroke-linecap="round" />

        <rect x="1400" y="600" width="200" height="200" fill="#9eaeb8" />
        <polygon points="1400,600 1540,800 1400,800" fill="#4f6675" />

        <!-- ================= ДЕКОРАТИВНЫЕ ЛИНИИ И БРЫЗГИ ================= -->
        <g fill="none" stroke="#1c2a30" stroke-width="2" opacity="0.55">
          <path d="M 410,210 C 485,150 535,95 615,0" />
          <path d="M 830,270 C 860,180 845,120 915,40" />
          <path d="M 1280,200 C 1320,130 1330,80 1390,10" />
          <path d="M 22,400 C 42,520 18,640 48,780" />
        </g>

        <g fill="#233742" opacity="0.65">
          <circle cx="885" cy="45" r="4" />
          <circle cx="910" cy="62" r="2.5" />
          <circle cx="930" cy="35" r="3" />
          <circle cx="580" cy="445" r="3" />
          <circle cx="595" cy="470" r="2" />
          <circle cx="615" cy="490" r="3.5" />
          <circle cx="1510" cy="670" r="5" />
          <circle cx="1540" cy="705" r="3" />
          <circle cx="1485" cy="735" r="4" />
          <circle cx="1560" cy="750" r="2.5" />
        </g>

        <!-- ================= ТИПОГРАФИКА: КАДЫРКУЛОВ ДУЙШЕН ================= -->
        <g filter="url(#text-shadow)">
          <!-- Первая строка: Кадыркул [орнамент-о] в -->
          <text x="415" y="148" class="title-main">
            <tspan fill="#c48d3b">К</tspan><tspan fill="#0d3b54">ады</tspan><tspan fill="#d49c3d">ркул</tspan>
          </text>

          <!-- Геометрическая буква «о» в стиле кыргызского орнамента -->
          <g transform="translate(1390, 96)">
            <circle cx="0" cy="0" r="50" fill="#c9933b" />
            <polygon points="0,-46 46,0 0,46 -46,0" fill="#6b5231" />
            <path d="M 0,-32 L 32,0 L 0,32 L -32,0 L 0,-20 L 18,0 L 0,18 L -14,0"
                  fill="none" stroke="#e0b055" stroke-width="7" stroke-linejoin="miter" />
          </g>

          <!-- Финальная буква «в» -->
          <text x="1455" y="148" class="title-main" fill="#d49c3d">в</text>

          <!-- Вторая строка: Дуйшен -->
          <text x="1015" y="345" class="title-sub" fill="#f0e6d2">Дуйшен</text>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
